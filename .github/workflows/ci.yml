name: CI / Deploy

# What runs where (each suite runs exactly once; docs/TESTING.md mirrors this table):
#   checks        npm audit, typecheck, lint, unit tests (with qpdf), production build
#   chromium      e2e on emulated Chromium devices (tablet, mid-range Android, Pixel, 320 px) vs `vite preview`
#   cross-engine  e2e on Firefox + WebKit (desktop, iPad, iPhone SE emulation) vs `vite preview`
#   cloudflare    full desktop e2e suite + 30-scenario real-world QA vs Cloudflare's Pages runtime
#                 (`wrangler pages dev` → workerd), with qpdf / pypdf / pyHanko validators
#   deploy        only after ALL of the above pass, and only when vars.DEPLOY_ENABLED == 'true'
# Any test failure, or a test that only passes on retry, fails the workflow.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  SITE_URL: ${{ vars.SITE_URL }} # optional: enables canonical links + sitemap

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Install qpdf (structural validation in unit tests)
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  chromium:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      # Desktop Chromium runs in the cloudflare job instead, so it isn't executed twice.
      - run: npx playwright test --project=tablet-android --project=android-midrange --project=mobile --project=narrow-320
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-chromium
          path: playwright-report
          retention-days: 7

  cross-engine:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALL_BROWSERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install qpdf (structural validation in e2e tests)
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - run: npx playwright install --with-deps firefox
      # WebKit (Safari) projects are skipped in CI for now, at the owner's request; run them locally with ALL_BROWSERS=1.
      - run: npx playwright test --project=firefox
      # Diagnostics only (does not change the job result): browser-process output for the Firefox a11y run.
      - name: Firefox a11y browser log (diagnostics)
        if: failure()
        run: DEBUG=pw:browser npx playwright test tests/e2e/a11y.spec.ts --project=firefox --retries=0 --grep "en, light" 2>&1 | tail -n 300 || true
      # Temporary: controlled experiments for the Firefox crash (does not change the job result).
      - name: Firefox crash experiments (diagnostics)
        if: always()
        run: |
          FIREFOX_DIAG=1 npx playwright test tests/e2e/firefox-diag.spec.ts --project=firefox --retries=0 --workers=1 --reporter=list 2>&1 | grep -E "DIAG|✓|✘|passed|failed" || true
          echo "--- real a11y spec, en light, alone ---"
          DEBUG=pw:browser npx playwright test tests/e2e/a11y.spec.ts -g "en, light" --project=firefox --retries=0 --workers=1 --reporter=list 2>&1 | grep -E "pw:browser.*(Crash|crash|signal|SIG|Assert|MOZ|error)|✓|✘|passed|failed" | head -40 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-cross-engine
          path: playwright-report
          retention-days: 7

  cloudflare:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install validators (qpdf, pypdf, pyHanko) and QA input generators (Pillow, reportlab)
        run: |
          sudo apt-get update && sudo apt-get install -y qpdf
          python -m pip install pillow reportlab pypdf pyhanko
      - run: npx playwright install --with-deps chromium
      - name: Desktop e2e suite on Cloudflare's Pages runtime
        run: npm run test:cloudflare
      - name: Real-world QA (30 scenarios) on Cloudflare's Pages runtime
        run: npm run qa:cloudflare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report
          path: docs/QA_REPORT.md
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-cloudflare
          path: |
            playwright-report
            qa/test-results
          retention-days: 7

  deploy:
    needs: [checks, chromium, cross-engine, cloudflare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    # Forks don't get secrets; skip deploy there instead of failing. Opt-in via repository variable.
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'freepdf' }} --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
