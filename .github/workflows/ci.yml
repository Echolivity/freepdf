name: CI / Deploy

# What runs where (each suite runs exactly once; docs/TESTING.md mirrors this table):
#   checks        npm audit (scripts/audit.mjs), typecheck, lint, unit tests (with qpdf), production build
#   chromium      e2e on emulated Chromium devices (tablet, mid-range Android, Pixel, 320 px) vs `vite preview`
#   cross-engine  e2e on Firefox + WebKit (desktop, iPad, iPhone SE emulation) vs `vite preview`
#   cloudflare    full desktop e2e suite + 30-scenario real-world QA vs Cloudflare's Pages runtime
#                 (`wrangler pages dev` → workerd), with qpdf / pypdf / pyHanko validators
#   deploy        only after ALL of the above pass, and only when vars.DEPLOY_ENABLED == 'true'
# Any test failure, or a test that only passes on retry, fails the workflow.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  SITE_URL: ${{ vars.SITE_URL }} # optional: enables canonical links + sitemap

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (fail on high/critical)
        # npm audit --audit-level=high, minus dated exceptions listed (with reasons) in the script.
        run: node scripts/audit.mjs
      - name: Install qpdf (structural validation in unit tests)
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3

  chromium:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      # Desktop Chromium runs in the cloudflare job instead, so it isn't executed twice.
      - run: npx playwright test --project=tablet-android --project=android-midrange --project=mobile --project=narrow-320
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-chromium
          path: playwright-report
          retention-days: 7

  cross-engine:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALL_BROWSERS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install qpdf (structural validation in e2e tests)
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - run: npx playwright install --with-deps firefox
      # WebKit (Safari) projects are skipped in CI for now, at the owner's request; run them locally with ALL_BROWSERS=1.
      - run: npx playwright test --project=firefox
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-cross-engine
          path: playwright-report
          retention-days: 7

  cloudflare:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install validators (qpdf, pypdf, pyHanko) and QA input generators (Pillow, reportlab)
        run: |
          sudo apt-get update && sudo apt-get install -y qpdf
          python -m pip install pillow reportlab pypdf pyhanko
      - run: npx playwright install --with-deps chromium
      - name: Desktop e2e suite on Cloudflare's Pages runtime
        run: npm run test:cloudflare
      - name: Real-world QA (30 scenarios) on Cloudflare's Pages runtime
        run: npm run qa:cloudflare
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-report
          path: docs/QA_REPORT.md
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-cloudflare
          path: |
            playwright-report
            qa/test-results
          retention-days: 7

  deploy:
    needs: [checks, chromium, cross-engine, cloudflare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    # Forks don't get secrets; skip deploy there instead of failing. Opt-in via repository variable.
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Pre-flight: check the saved credentials without printing them, so a mistyped or badly pasted secret
      # fails here with a plain message instead of an opaque Wrangler error.
      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ok=1
          lines=$(printf '%s' "$CF_TOKEN" | awk 'END { print NR }')
          echo "Token: ${#CF_TOKEN} characters, ${lines} line(s)."
          if [ -z "$CF_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN is empty."; ok=0; fi
          case "$CF_TOKEN" in [Bb]earer*) echo "::error::CLOUDFLARE_API_TOKEN starts with 'Bearer': save the token alone."; ok=0;; esac
          if [ "$lines" -gt 1 ]; then echo "::error::CLOUDFLARE_API_TOKEN has more than one line: paste only the token."; ok=0; fi
          if printf '%s' "$CF_TOKEN" | grep -q '[[:space:]]'; then echo "::error::CLOUDFLARE_API_TOKEN contains spaces or line breaks."; ok=0; fi
          if printf '%s' "$CF_TOKEN" | LC_ALL=C grep -q '[^A-Za-z0-9_.-]'; then echo "::error::CLOUDFLARE_API_TOKEN contains characters a Cloudflare token doesn't have (quotes, punctuation or non-Latin characters)."; ok=0; fi
          echo "Account ID: ${#CF_ACCOUNT} characters."
          if ! printf '%s' "$CF_ACCOUNT" | grep -Eq '^[0-9a-f]{32}$'; then echo "::error::CLOUDFLARE_ACCOUNT_ID should be 32 lowercase hex characters, with nothing else."; ok=0; fi
          [ "$ok" = 1 ] || exit 1
          code=$(curl -s -o verify.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          status=$(jq -r '.result.status // "unknown"' verify.json 2>/dev/null)
          rm -f verify.json
          echo "Cloudflare token check: HTTP $code, status $status."
          if [ "$code" != 200 ] || [ "$status" != active ]; then echo "::error::Cloudflare didn't accept the token (HTTP $code, status $status). Create or roll it again and re-save the secret."; exit 1; fi
      # First deploy: create the Pages project (production branch main) if it doesn't exist yet. When it
      # already exists this step fails harmlessly; a real problem (bad token) also fails the deploy below.
      - name: Create the Cloudflare Pages project if needed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ vars.CF_PAGES_PROJECT || 'freepdf' }} --production-branch=main
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'freepdf' }} --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
