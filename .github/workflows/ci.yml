name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      ALL_BROWSERS: '1' # Firefox + WebKit projects in addition to Chromium devices
      SITE_URL: ${{ vars.SITE_URL }} # optional: enables canonical links + sitemap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Install qpdf (structural validation of generated PDFs)
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - name: Browser suite against Cloudflare's Pages runtime (wrangler pages dev / workerd)
        run: npm run test:cloudflare
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Forks don't get secrets; skip deploy there instead of failing. Deploys only when secrets exist.
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'freepdf' }} --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
